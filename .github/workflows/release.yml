name: Panel Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: service
      - uses: actions/checkout@v7
        with:
          repository: Legacy-Hosting/LH-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          path: releases
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: service/pnpm-lock.yaml
      - name: Verify and build
        working-directory: service
        env:
          VITE_API_URL: https://api.legacyhosting.xyz/api/v1
        run: |
          pnpm install --frozen-lockfile
          bash -n ops/scripts/*.sh
          shellcheck --severity=error ops/scripts/*.sh
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm audit --prod --audit-level high
      - name: Build immutable release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          service/ops/scripts/build-release.sh "$VERSION" "$GITHUB_WORKSPACE/releases"
      - name: Publish to LH-Releases
        working-directory: releases
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git lfs install --local
          git config user.name "Legacy Hosting Releases"
          git config user.email "releases@legacyhosting.xyz"
          git add LH-Panel
          git commit -m "release: LH-Panel ${RELEASE_VERSION#v}"
          git pull --rebase origin main
          git push origin HEAD:main
